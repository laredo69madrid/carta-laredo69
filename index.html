:12px;border-top:1px solid #76673c;margin-top:34px;padding-top:20px}#laredo-nov-menu .signature{font:11px Arial,sans-serif;color:#d4c38a;margin-left:8px}@media(max-width:380px){#laredo-nov-menu{padding:22px 15px}#laredo-nov-menu h2{font-size:20px}}

['Paloma',duo('Tequila · limón · pomelo rosa · sal Maldon','Tequila · lemon · pink grapefruit · Maldon salt'),duo('CÍTRICA · SALINA · REFRESCANTE','CITRUSY · SALINE · REFRESHING')],

['Campari Spritz',duo('Campari · Prosecco · soda','Campari · Prosecco · soda water'),duo('AMARGO · INTENSO · BURBUJEANTE','BITTER · BOLD · SPARKLING')],

['Espresso Martini',duo('Vodka · licor de café · café espresso','Vodka · coffee liqueur · espresso'),duo('CAFÉ · INTENSO · SEDOSO','COFFEE · BOLD · SILKY')],
['Piña Colada',duo('Ron · piña · crema de coco','Rum · pineapple · cream of coconut'),duo('TROPICAL · CREMOSA · AFRUTADA','TROPICAL · CREAMY · FRUITY')]
];
const zero=[['Laredo Sunset 0,0',duo('Hibisco · pomelo rosa · limón','Hibiscus · pink grapefruit · lemon'),duo('FLORAL · CÍTRICO · BURBUJEANTE','FLORAL · CITRUSY · SPARKLING')],['Mojito 0,0',duo('Lima · hierbabuena · azúcar · soda','Lime · mint · sugar · soda water'),duo('REFRESCANTE · CÍTRICO · HERBAL','REFRESHING · CITRUSY · HERBAL')],['Moscow Mule 0,0',duo('Lima · ginger beer sin alcohol','Lime · alcohol-free ginger beer'),duo('FRESCO · CÍTRICO · ESPECIADO','FRESH · CITRUSY · SPICY')]];
zero.push([duo('Moscow Mule de naranja 0,0','Orange Moscow Mule 0.0'),duo('Lima · naranja · ginger beer sin alcohol','Lime · orange · alcohol-free ginger beer'),duo('CÍTRICO · AFRUTADO · ESPECIADO','CITRUSY · FRUITY · SPICY')]);
const spirits=[
[duo('Ginebras','Gin'),[[duo('Clásicas & Sabores','Classic & Flavoured'),'7 €','Seagram’s · Beefeater · Tanqueray · Puerto de Indias · Larios Rosé'],['Premium','9 €','Roku · Nordés · Hendrick’s · Brockman’s']]],
[duo('Rones','Rum'),[[duo('Clásicos','Classics'),'7 €','Barceló · Brugal · Bacardí'],[duo('Añejos','Aged'),'10 €','Havana Club 7 · Matusalém 7'],[duo('Reserva','Reserve'),'11 €','Matusalém 15 · Flor de Caña 12'],['Zacapa 23','15 €','']]],
['Whisky & Vodka',[[duo('Clásicos','Classics'),'7 €','Red Label · J&B · Ballantine’s'],['Jack Daniel’s','9 €',''],['Black Label','10 €',''],[duo('Whisky japonés','Japanese whisky'),'12 €',''],['Grey Goose','12 €','']]]];
const bites=[
[duo('Gilda clásica','Classic Gilda'),duo('Elaborada a mano con anchoa en salazón, piparra y aceituna manzanilla. El aperitivo de siempre.','Handmade with salt-cured anchovy, pickled green pepper and a Manzanilla olive. A timeless aperitif.'),'3 €','Campari Spritz'],
[duo('Gilda de anchoa con alegría','Spicy anchovy Gilda'),duo('Anchoa, piparra y aceituna manzanilla con el toque picante de la alegría riojana. Elaborada a mano.','Handmade with anchovy, pickled green pepper and a Manzanilla olive, with a spicy kick from alegría riojana chilli.'),'3 €','Aperol Spritz',duo('PICANTE','SPICY')],
[duo('Gilda de boquerón','Marinated white anchovy Gilda'),duo('Boquerón, piparra y aceituna manzanilla, ensartados a mano. Una alternativa a la gilda tradicional.','Hand-assembled with marinated white anchovy, pickled green pepper and a Manzanilla olive. A twist on the traditional Gilda.'),'3 €','Margarita'],
[duo('Gilda de queso y anchoa','Cheese & anchovy Gilda'),duo('La combinación de anchoa, piparra y aceituna manzanilla con un bocado de queso. Elaborada a mano.','Anchovy, pickled green pepper and a Manzanilla olive paired with a bite of cheese. Handmade.'),'3 €','Laredo Sunset'],
[duo('Anchoa Gran Reserva Rezumar','Rezumar Gran Reserva anchovy'),duo('Anchoa del Cantábrico elaborada en Laredo y madurada 12 meses en barrica, sobre pan artesanal con un velo de mantequilla.','Cantabrian anchovy prepared in Laredo and barrel-matured for 12 months, served on artisan bread with a thin layer of butter.'),'4 €','Paloma']];
const standardGildaAllergens=duo('Contiene pescado y sulfitos. Puede contener trazas de crustáceos, huevo, leche y moluscos.','Contains fish and sulphites. May contain traces of crustaceans, egg, milk and molluscs.');
const biteAllergens=[
standardGildaAllergens,
standardGildaAllergens,
standardGildaAllergens,
duo('Contiene pescado, leche, huevo y sulfitos. Puede contener trazas de crustáceos y moluscos.','Contains fish, milk, egg and sulphites. May contain traces of crustaceans and molluscs.'),
duo('Contiene pescado, gluten (pan) y leche (mantequilla).','Contains fish, gluten (bread) and milk (butter).')
];
function draw(language){
const k=language==='en'?1:0; const t=v=>Array.isArray(v)?v[k]:v;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=t(text);return n;};
const main=root.querySelector('main');main.replaceChildren();root.lang=language;
function section(title,price,intro){const s=el('section');const h=el('h2');h.append(el('span','',title));if(price)h.append(el('span','',price));s.append(h);if(intro)s.append(el('p','intro',intro));main.append(s);return s;}
function item(s,name,desc,profile,price){const d=el('div','item');const r=el('div','row');r.append(el('div','name',name));if(price)r.append(el('div','price',price));d.append(r);if(profile)d.append(el('div','profile',profile));if(desc)d.append(el('div','desc',desc));s.append(d);return d;}
let s=section(duo('CÓCTELES DE AUTOR','SIGNATURE COCKTAILS'),'8 €',duo('Nuestra forma de empezar la tarde.','Our way to start the afternoon.'));
let signature=item(s,'Laredo Sunset',duo('Vodka · hibisco · pomelo rosa','Vodka · hibiscus · pink grapefruit'),duo('FRESCO · FLORAL · VIBRANTE','FRESH · FLORAL · VIBRANT'));signature.querySelector('.name').append(el('span','signature',duo('FIRMA','SIGNATURE')));
item(s,duo('Café de Nochebuena','Café de Nochebuena · Christmas Eve Coffee'),duo('Ron añejo · licor de café · espresso · aroma de piel de naranja','Aged rum · coffee liqueur · espresso · orange peel aroma'),duo('ESPECIAL DE NAVIDAD · CAFÉ · AROMÁTICO','CHRISTMAS SPECIAL · COFFEE · AROMATIC'));
s=section(duo('CLÁSICOS DEL TARDEO','CLASSIC COCKTAILS'),'8 €',duo('Encuentra tu cóctel, disfruta tu tarde.','Find your cocktail, enjoy your afternoon.'));cocktails.forEach(c=>item(s,...c));
s=section(duo('0,0 · SIN ALCOHOL','0.0 · ALCOHOL FREE'),'6 €',duo('Todo el ritual. Sin alcohol.','All the ritual. Alcohol free.'));zero.forEach(c=>item(s,...c));
s=section(duo('COPAS & PERFECT SERVE','SPIRITS & PERFECT SERVE'));spirits.forEach(g=>{s.append(el('h3','',g[0]));g[1].forEach(c=>item(s,c[0],c[2],null,c[1]));});
s=section(duo('APERITIVOS','APERITIFS'));item(s,duo('Vermut tradicional','Traditional vermouth'),duo('Vermut rojo · sifón','Red vermouth · soda water'),null,'4 €');
s=section(duo('CERVEZAS · TERCIOS','BOTTLED BEER'),'4 €');['Mahou','Alhambra Verde','1906'].forEach(n=>item(s,n));
s=section(duo('VINOS · POR COPAS','WINE BY THE GLASS'),'3 €');item(s,'Verdejo',null,duo('FRESCO · FRUTAL · LIGERO','FRESH · FRUITY · LIGHT'));item(s,'Alma',null,duo('SEMIDULCE','SEMI-SWEET'));item(s,'Rioja',null,duo('EQUILIBRADO · FRUTAL · SUAVE','BALANCED · FRUITY · SMOOTH'));
s=section(duo('PARA PICAR','SMALL BITES'),null,duo('Pequeños bocados para acompañar una buena tarde. Precios por unidad.','Small bites for a lovely afternoon. Prices per piece.'));bites.forEach((c,i)=>{const d=item(s,c[0],c[1],c[4],c[2]);d.append(el('div','desc',biteAllergens[i]));d.append(el('div','pair',(k?'Try it with: ':'Pruébala con: ')+c[3]+'.'));});s.append(el('p','intro',duo('Cócteles aparte.','Cocktails sold separately.')));
const footer=root.querySelector('footer');footer.replaceChildren(el('div','','LAREDO 69 · MADRID'),el('div','',duo('Consulta al personal sobre alérgenos · IVA incluido','Please ask our staff about allergens · VAT included')));
root.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===language)));
}
root.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>draw(b.dataset.lang)));draw('es');
